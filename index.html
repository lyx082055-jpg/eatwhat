<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午饭抽签机 🍜</title><style>:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#253047;background:#fff8ed}*{box-sizing:border-box}body{margin:0;padding:30px 15px}.wrap{max-width:780px;margin:auto}h1{text-align:center;font-size:clamp(30px,6vw,46px);margin:10px 0}p{text-align:center;color:#777}.panel{background:white;border-radius:24px;padding:25px;box-shadow:0 12px 35px #ad79421c;margin:20px 0}textarea{width:100%;min-height:145px;padding:15px;border:2px solid #f0e6d7;border-radius:14px;font:16px/1.8 inherit;resize:vertical}button{border:0;border-radius:13px;padding:12px 19px;font-size:16px;font-weight:700;cursor:pointer;background:#fff0d7;color:#6e4217}button.primary{background:#f4753c;color:white}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.wheelbox{display:flex;justify-content:center;position:relative;margin:25px auto 12px;max-width:430px}.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:2;font-size:36px;color:#e45b2c;text-shadow:0 2px white}canvas{width:100%;aspect-ratio:1;filter:drop-shadow(0 8px 15px #cba66d55)}.result{text-align:center;font-size:25px;font-weight:800;min-height:44px;color:#d75b2e}.small{font-size:13px;color:#888;text-align:center}.count{margin-top:8px;color:#a27e57;font-size:14px}.center{text-align:center}.center button{font-size:20px;padding:15px 40px}#history{color:#6c6870;text-align:center;line-height:2;overflow-wrap:anywhere}@media(max-width:500px){.panel{padding:17px}}</style></head><body><main class="wrap"><h1>🍜 今天中午吃什么？</h1><p>别纠结了，让命运决定午饭！</p><section class="panel"><h2>🥢 候选菜单</h2><textarea id="items" placeholder="一行一个选择，也支持逗号分隔"></textarea><div class="count" id="count"></div><div class="actions"><button id="save">更新转盘</button><button id="demo">恢复示例</button><button id="share">🔗 复制分享链接</button></div></section><section class="panel"><div class="wheelbox"><span class="pointer">▼</span><canvas id="wheel" width="800" height="800"></canvas></div><div class="center"><button class="primary" id="spin">🎲 一键抽签</button></div><div class="result" id="result">准备好了吗？</div><div class="small">公平随机 · 每个选项概率相同</div></section><section class="panel"><h2>📜 抽签记录</h2><div id="history">还没有抽签记录</div></section></main><script>const $=id=>document.getElementById(id),defaults=['黄焖鸡米饭','麻辣烫','兰州拉面','饺子','盖浇饭','汉堡炸鸡','螺蛳粉','砂锅米线'];let entries=[],angle=0,spinning=false,history=[];function parse(s){return [...new Set(s.split(/[\n,，、;；]+/).map(x=>x.trim()).filter(Boolean))].slice(0,100)}function sync(){entries=parse($('items').value);localStorage.setItem('lunch_options',JSON.stringify(entries));$('count').textContent=`共 ${entries.length} 个选项（最多100个）`;draw()}function draw(){let c=$('wheel'),ctx=c.getContext('2d'),n=entries.length;ctx.clearRect(0,0,800,800);let r=365,x=400,y=400;ctx.save();ctx.translate(x,y);ctx.rotate(angle);if(!n){ctx.fillStyle='#f9e5c6';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill()}else entries.forEach((name,i)=>{let start=-Math.PI/2+i*2*Math.PI/n,end=start+2*Math.PI/n;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,end);ctx.closePath();ctx.fillStyle=`hsl(${(i*137.5+20)%360} 78% 77%)`;ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(start+Math.PI/n);ctx.translate(r*.60,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#43342c';ctx.font=`bold ${n>18?19:n>10?24:31}px sans-serif`;ctx.textAlign='center';let t=name.length>9?name.slice(0,8)+'…':name;ctx.fillText(t,0,8,r*.70);ctx.restore()});ctx.restore();ctx.beginPath();ctx.arc(x,y,45,0,7);ctx.fillStyle='white';ctx.fill();ctx.fillStyle='#f4753c';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('吃!',x,y+8)}function random(){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}function spin(){sync();if(spinning)return;if(entries.length<2){$('result').textContent='至少输入两个选项哦';return}spinning=true;$('spin').disabled=true;$('result').textContent='命运正在选择…';let n=entries.length,winner=Math.floor(random()*n),step=2*Math.PI/n,desired=-(winner+.5)*step,from=angle,to=desired+Math.ceil((from+Math.PI*12-desired)/(2*Math.PI))*2*Math.PI,duration=4200,start=performance.now();function tick(t){let p=Math.min((t-start)/duration,1),ease=1-Math.pow(1-p,4);angle=from+(to-from)*ease;draw();if(p<1)requestAnimationFrame(tick);else{angle=((to%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);spinning=false;$('spin').disabled=false;$('result').textContent='🎉 今天就吃：'+entries[winner]+'！';history.unshift(entries[winner]);$('history').textContent=history.slice(0,8).map((x,i)=>`${i+1}. ${x}`).join('　｜　')}}requestAnimationFrame(tick)}function encode(arr){let bytes=new TextEncoder().encode(JSON.stringify(arr));let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function decode(s){let bin=atob(s.replace(/-/g,'+').replace(/_/g,'/')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}let init;try{init=location.hash.startsWith('#menu=')?decode(location.hash.slice(6)):JSON.parse(localStorage.getItem('lunch_options')||'null')}catch(e){}$('items').value=(Array.isArray(init)&&init.length?init:defaults).join('\n');sync();$('save').onclick=()=>{sync();$('result').textContent='菜单已更新！'};$('demo').onclick=()=>{$('items').value=defaults.join('\n');sync()};$('spin').onclick=spin;$('share').onclick=async()=>{sync();let url=location.href.split('#')[0]+'#menu='+encode(entries);try{await navigator.clipboard.writeText(url);$('result').textContent='🔗 分享链接已复制！'}catch(e){prompt('复制这个链接发给同事：',url)}};$('items').addEventListener('input',()=>{$('count').textContent=`当前输入 ${parse($('items').value).length} 个选项，点击更新转盘`});</script></body></html>
